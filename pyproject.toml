[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-rag"
version = "0.1.0"
description = "LLM-built RAG corpus + hybrid BM25/dense retrieval over any document set"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "numpy>=1.26.0",
    "msgspec>=0.19.0",
    "xxhash>=3.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tqdm>=4.66.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.60.0",
    "anthropic>=0.60.0",
    "httpx>=0.27.0",
    "regex>=2024.0.0",
    "torch>=2.13.0",
    "json-repair>=0.59.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[tool.uv]
link-mode = "symlink"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
